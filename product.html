<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Details | Cocoa Bliss</title>

<style>
:root {
  --dark: #28130f;
  --brown: #49271d;
  --gold: #d8b16d;
  --cream: #fbf4e9;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--cream);
  color: var(--dark);
  font-family: Georgia, serif;
}

a { text-decoration: none; color: inherit; }

header {
  background: var(--dark);
  color: white;
  padding: 20px 5%;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  color: var(--gold);
  font-size: 24px;
  letter-spacing: 2px;
}

nav a:last-child {
  font: 13px Arial;
  color: var(--cream);
}

.product-page {
  width: 90%;
  max-width: 1100px;
  margin: 55px auto;
}

.back {
  display: inline-block;
  margin-bottom: 30px;
  font: 13px Arial;
  color: #80624b;
}

.details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 55px;
  align-items: center;
}

.product-image {
  width: 100%;
  height: 470px;
  object-fit: cover;
  background: #ead9c5;
}

.kicker {
  color: #a77a3f;
  font: 11px Arial;
  letter-spacing: 3px;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(35px, 5vw, 52px);
  font-weight: normal;
  line-height: 1.15;
  margin-bottom: 18px;
}

.price {
  color: #986b32;
  font-size: 27px;
  margin-bottom: 22px;
}

.description {
  color: #806b5b;
  font: 14px/1.9 Arial;
  margin-bottom: 25px;
}

.label {
  font: 13px Arial;
  margin-bottom: 12px;
}

.qty {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 25px;
}

.qty button {
  background: white;
  border: 1px solid #cbb9a5;
  width: 36px;
  height: 36px;
  font-size: 19px;
  cursor: pointer;
}

#quantity {
  font: 15px Arial;
}

.action {
  display: block;
  width: 100%;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--dark);
  cursor: pointer;
  font: bold 12px Arial;
  letter-spacing: 1px;
}

.add {
  background: var(--dark);
  color: white;
}

.buy {
  background: var(--gold);
  color: var(--dark);
  border-color: var(--gold);
}

.action:hover {
  opacity: .85;
}

.note {
  text-align: center;
  color: #8b7766;
  font: 12px/1.8 Arial;
  margin-top: 22px;
}

footer {
  text-align: center;
  background: #1b0c09;
  color: #d8c5b5;
  padding: 28px;
  font: 12px/2 Arial;
}

@media(max-width: 700px) {
  .product-page { margin: 30px auto; }
  .details {
    grid-template-columns: 1fr;
    gap: 30px;
  }
  .product-image { height: 320px; }
  h1 { font-size: 38px; }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html" class="brand">COCOA BLISS</a>
    <a href="index.html#products">← COLLECTION</a>
  </nav>
</header>

<main class="product-page">
  <a class="back" href="index.html#products">
    ← Back to collection
  </a>

  <div class="details">
    <div>
      <img id="product-image" class="product-image"
           src="" alt="Chocolate product">
    </div>

    <div>
      <div class="kicker">THE SIGNATURE COLLECTION</div>
      <h1 id="product-name">Chocolate</h1>
      <div class="price" id="product-price">₹0</div>
      <p class="description" id="product-description"></p>

      <p class="label">Quantity</p>
      <div class="qty">
        <button onclick="changeQuantity(-1)">−</button>
        <span id="quantity">1</span>
        <button onclick="changeQuantity(1)">+</button>
      </div>

      <button class="action add" onclick="addToBag()">
        ADD TO BAG
      </button>

      <button class="action buy" onclick="buyNow()">
        BUY NOW VIA WHATSAPP ♡
      </button>

      <p class="note">
        Heartfully crafted chocolates.<br>
        A little luxury in every bite.
      </p>
    </div>
  </div>
</main>

<footer>
  <p class="brand">COCOA BLISS</p>
  <p>Handcrafted chocolate. Thoughtfully gifted.</p>
  <p>© <span id="year"></span> Cocoa Bliss.</p>
</footer>

<script>
const WHATSAPP_NUMBER = "919876543210";
// Replace with your real WhatsApp number.

const products = [
  {
    id: 1,
    name: "Velvet Truffles",
    price: 349,
    desc: "A luxurious chocolate indulgence.",
    image: "https://images.unsplash.com/photo-1511381939415-e44015466834?auto=format&fit=crop&w=900&q=85"
  },
  {
    id: 2,
    name: "Luxury Gift Box",
    price: 699,
    desc: "A beautiful chocolate gift for special moments.",
    image: "https://images.unsplash.com/photo-1548907040-4d42baa2a6a6?auto=format&fit=crop&w=900&q=85"
  },
  {
    id: 3,
    name: "Signature Chocolate",
    price: 249,
    desc: "A classic treat for every chocolate lover.",
    image: "https://images.unsplash.com/photo-1481391319762-47dff72954d9?auto=format&fit=crop&w=900&q=85"
  },
  {
    id: 4,
    name: "Chocolate Bites",
    price: 299,
    desc: "Little bites of chocolate happiness.",
    image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85"
  }
];

const money = n => "₹" + n.toLocaleString("en-IN");

const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id")) || 1;
const product = products.find(p => p.id === id) || products[0];

let quantity = 1;

document.title = product.name + " | Cocoa Bliss";

document.getElementById("product-name").textContent = product.name;
document.getElementById("product-price").textContent =
  money(product.price);
document.getElementById("product-description").textContent =
  product.desc;
document.getElementById("product-image").src = product.image;
document.getElementById("product-image").alt = product.name;
document.getElementById("year").textContent = new Date().getFullYear();

function changeQuantity(amount) {
  quantity = Math.max(1, quantity + amount);
  document.getElementById("quantity").textContent = quantity;
}

function getBag() {
  try {
    return JSON.parse(localStorage.getItem("cocoaBlissBag")) || [];
  } catch {
    return [];
  }
}

function saveBag(bag) {
  localStorage.setItem("cocoaBlissBag", JSON.stringify(bag));
}

function addToBag() {
  const bag = getBag();
  const item = bag.find(p => p.id === product.id);

  if (item) {
    item.qty += quantity;
  } else {
    bag.push({
      ...product,
      qty: quantity
    });
  }

  saveBag(bag);
  alert(product.name + " added to your bag!");
}

function buyNow() {
  const message = [
    "Hello Cocoa Bliss! I'd like to order:",
    "",
    product.name,
    "Quantity: " + quantity,
    "Price: " + money(product.price * quantity),
    "",
    "Please confirm availability and delivery details."
  ].join("\n");

  window.open(
    "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(message),
    "_blank"
  );
}
</script>

</body>
</html>
